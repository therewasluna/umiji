# Posts each push to main to the Telegram channel @umijidev as a rich message: the repo, the commit
# titles and a button to the changes.
# Every Umiji repo calls this from its own .github/workflows/telegram.yml and keeps the bot token in
# its TELEGRAM_BOT_TOKEN secret. A commit with "[skip tg]" in its message is left out of the post.
name: Telegram post

on:
  workflow_call:
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: true

permissions: {}

jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - name: Post to @umijidev
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: '@umijidev'
        run: |
          python3 - <<'EOF'
          import html, json, os, sys, urllib.error, urllib.request

          if not os.environ.get('TOKEN'):
              sys.exit('TELEGRAM_BOT_TOKEN is missing in this repo')

          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          repo = event['repository']['name']
          commits = [c for c in event.get('commits') or [] if '[skip tg]' not in c['message']]
          if not commits:
              print('Nothing to post.')
              sys.exit(0)

          # A rich message (Bot API 10.1): a heading, the commit titles as a real list, and a button.
          MAX_LINES = 15  # a big push stays short in the channel
          titles = [html.escape(c['message'].splitlines()[0]) for c in commits]
          count = f"{len(commits)} change{'s' if len(commits) != 1 else ''}"
          items = ''.join(f'<li>{t}</li>' for t in titles[:MAX_LINES])
          if len(titles) > MAX_LINES:
              items += f'<li><i>…and {len(titles) - MAX_LINES} more</i></li>'
          page = f'<h2>🔧 {html.escape(repo)}</h2><p>{count}</p><ul>{items}</ul>'
          link = event['compare'] if len(commits) > 1 else commits[0]['url']

          if os.environ.get('DRY_RUN'):
              print(page, link, sep='\n')
              sys.exit(0)

          body = json.dumps({
              'chat_id': os.environ['CHAT'],
              'rich_message': {'html': page},
              'reply_markup': {'inline_keyboard': [[{'text': 'See it on GitHub', 'url': link}]]},
          }).encode()
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TOKEN']}/sendRichMessage",
              body,
              {'Content-Type': 'application/json'},
          )
          try:
              urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as error:
              sys.exit(f'Telegram refused the post: {error.read().decode()}')
          print('Posted.')
          EOF
